        src=\\'//genius.com/songs/12287956/embed.js\\'><\\/script>\\\",\\\"descriptionPreview\\\":\\\"“The
        Fate of Ophelia” opens The Life of a Showgirl with a direct reference to Shakespeare’s
        tragic heroine, Ophelia, from the play Hamlet.\\\\n\\\\nThe character of Ophelia
        has descent into madness and drowning has been interpreted as a metaphor for
