        her interview with Magic radio, she explained that The Fate of Ophelia is
        a song about \\\\\\\"feeling for a long time like you might have met a  similar
        fate to Ophelia, who was driven mad over the years slowly by love. And instead,
        you know, I kind of give her a bit of a - we referenced her fate, but you
        talk about sort of someone saving you from that fate. And like, how euphoric
        that feels to look at. Maybe your past experiences with heartbreak and feel
        that you\\'ve been rescued by this fortuitous turn of events where you ended
        up finding a person that changed that for you.\\\\\\\"\\\",\\\"html\\\":\\\"<p>In
        her interview with Magic radio, she explained that The Fate of Ophelia is
        a song about “feeling for a long time like you might have met a  similar fate
        to Ophelia, who was driven mad over the years slowly by love. And instead,
        you know, I kind of give her a bit of a – we referenced her fate, but you
