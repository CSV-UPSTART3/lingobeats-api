        [BBC Radio 1](https://www.youtube.com/watch?v=Cqw8fZhggbQ)\\\\n\\\\n<hr>\\\\n\\\\n>\\'The
        Fate of Ophelia\\' is the first track off of my album The Life of a Showgirl\\\\r\\\\nAnd
        I really love this song because it kind of combines sort of Shakespearean
        storytelling of you know, this legend of- of this tragic hero Ophelia and
        what happened to her blended with this kind of newer concept of escaping that
        fate and having more modern terminology used in the song too like, you know,
        \\'Keep it one-hundred on the land, the sea, the sky / Pledge allegiance to
        your hands, your team, your vibes.\\' I just love kind of, blending- the blending
        of old and new with lyrics and that\\'s one of my favorite parts about this
        song, but it\\'s also just kind of one of my favorite catchy melodies I\\'ve
        ever gotten to write.\\\\n\\\\n---via [Amazon Track By Track](https://music.amazon.com/albums/B0FTLD3NT7)\\\\n\\\",\\\"body\\\":{\\\"markdown\\\":\\\">Didn\\'t
        really need to reread it [Hamlet]. I wanted to sprinkle some references in
