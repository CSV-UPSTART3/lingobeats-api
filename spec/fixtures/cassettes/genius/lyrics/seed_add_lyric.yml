        id=\"artist_comment:song:12287956\" class=\"QuestionTemplate__Container-sc-2dcc5e84-1
        jrAlWV\"><div class=\"QuestionTemplate__Title-sc-2dcc5e84-4 jScfnY\"><span>What
        did Taylor Swift say about &quot;The Fate of Ophelia&quot;?</span><button
        class=\"TextButton-sc-5aad70cc-0 hythMh QuestionTemplate__ExpandButton-sc-2dcc5e84-5
        hqSInB\" type=\"button\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24
        24\"><path d=\"M0 10h24v4h-24z\"></path></svg></button></div><div class=\"Answer__Container-sc-31092ac-0
        dHSyhJ\"><div class=\"Attribution__Container-sc-6aa9ef14-0 jBMrvc\"><div class=\"Attribution__Header-sc-6aa9ef14-1
        cMLjaa\"><span class=\"Attribution__HeaderLabel-sc-6aa9ef14-2 jPvLhm\"><div
        class=\"Answer__AttributionLabel-sc-31092ac-3 dIgpeh\">Genius Answer</div></span><button
        text-decoration=\"underline\" type=\"button\" class=\"TextButton-sc-5aad70cc-0
        bZLNcX\">1 contributor</button></div></div><div class=\"Answer__Body-sc-31092ac-1
        cxDqOc\"><div class=\"RichText__Container-sc-e8f13224-0 kzIwpD\"><blockquote><p>Didn’t
        really need to reread it [Hamlet]. I wanted to sprinkle some references in
        the bridge, so like the the bridge references kind of some paraphrasing of
        some lines from Hamlet, so I did like do a little brush up. But I just love
        the idea that like, ‘You you saved me from love driving me mad,’ right? ‘Cause
        that’s what happened to Ophelia. Spoiler alert.</p></blockquote>\n\n<p>—via
        <a href=\"https://www.youtube.com/watch?v=Cqw8fZhggbQ\" rel=\"noopener nofollow\">BBC
        Radio 1</a></p>\n\n<hr>\n\n\n<blockquote><p>‘The Fate of Ophelia’ is the first
        track off of my album The Life of a Showgirl<br>\nAnd I really love this song
        because it kind of combines sort of Shakespearean storytelling of you know,
        this legend of- of this tragic hero Ophelia and what happened to her blended
        with this kind of newer concept of escaping that fate and having more modern
        terminology used in the song too like, you know, ‘Keep it one-hundred on the
        land, the sea, the sky / Pledge allegiance to your hands, your team, your
        vibes.’ I just love kind of, blending- the blending of old and new with lyrics
        and that’s one of my favorite parts about this song, but it’s also just kind
        of one of my favorite catchy melodies I’ve ever gotten to write.</p></blockquote>\n\n<p>—via
        <a href=\"https://music.amazon.com/albums/B0FTLD3NT7\" rel=\"noopener nofollow\">Amazon
        Track By Track</a></p></div></div></div><div class=\"QuestionAnswerActions__Container-sc-552102cd-0
