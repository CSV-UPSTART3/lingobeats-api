        throughout her career. In the play, the dissolving relationship between Hamlet
        and Ophelia drives her into a spiral of instability, a comparison Swift seems
        to be making to her own life.\\\\n\\\\nTaylor Swift has referenced Shakespeare
        throughout her career, with “Love Story” tying to Romeo and Juliet, and the
        lyrics “all’s well that ends well” from “All Too Well” also appearing in Hamlet.\\\\n\\\\nAdditionally,
