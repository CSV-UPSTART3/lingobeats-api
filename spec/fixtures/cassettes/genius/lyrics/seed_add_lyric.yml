        src=\\\\\\\"https://www.youtube-nocookie.com/embed/rbmdfEQODOw?modestbranding=1&amp;start=0&amp;showinfo=0&amp;enablejsapi=1&amp;origin=genius.com\\\\\\\"><\\/iframe>\\\\n<\\/div>\\\"},\\\"type\\\":\\\"answer\\\"},\\\"958765\\\":{\\\"authors\\\":[{\\\"user\\\":3499648,\\\"pinnedRole\\\":null,\\\"attribution\\\":1,\\\"type\\\":\\\"user_attribution\\\"}],\\\"answerSource\\\":null,\\\"currentUserMetadata\\\":{\\\"interactions\\\":{\\\"vote\\\":null},\\\"excludedPermissions\\\":[\\\"vote\\\",\\\"edit\\\",\\\"destroy\\\"],\\\"permissions\\\":[]},\\\"votesTotal\\\":9,\\\"id\\\":958765,\\\"hasVoters\\\":true,\\\"editorialState\\\":\\\"normal\\\",\\\"createdAt\\\":1759707317,\\\"bodyForEdit\\\":\\\">Writing,
        rehearsing, directing and shooting the music video for “The Fate of Ophelia”
        was the thrill of a lifetime because I got to be reunited with my Eras Tour
        family!! I wanted each one-take scene to feel like a live performance and
        remind us all of how it felt to be at those shows together. Making every moment
        count. It’s a journey through the chaotic world of show business. I loved
        working with Rodrigo Prieto, Ethan Tobman and Mandy Moore to dream up these
        visuals. A huge thank you to this massive cast who kept it \U0001F4AF and
        also kept the secret of this video even existing.\\\\n\\\\n--via [X](https://x.com/taylorswift13/status/1974974882283725029)
        (October 5, 2025)\\\\n\\\",\\\"body\\\":{\\\"markdown\\\":\\\">Writing, rehearsing,
        directing and shooting the music video for “The Fate of Ophelia” was the thrill
        of a lifetime because I got to be reunited with my Eras Tour family!! I wanted
        each one-take scene to feel like a live performance and remind us all of how
        it felt to be at those shows together. Making every moment count. It’s a journey
        through the chaotic world of show business. I loved working with Rodrigo Prieto,
        Ethan Tobman and Mandy Moore to dream up these visuals. A huge thank you to
        this massive cast who kept it \U0001F4AF and also kept the secret of this
        video even existing.\\\\n\\\\n--via [X](https://x.com/taylorswift13/status/1974974882283725029)
        (October 5, 2025)\\\\n\\\",\\\"html\\\":\\\"<blockquote><p>Writing, rehearsing,
        directing and shooting the music video for “The Fate of Ophelia” was the thrill
        of a lifetime because I got to be reunited with my Eras Tour family!! I wanted
        each one-take scene to feel like a live performance and remind us all of how
        it felt to be at those shows together. Making every moment count. It’s a journey
        through the chaotic world of show business. I loved working with Rodrigo Prieto,
        Ethan Tobman and Mandy Moore to dream up these visuals. A huge thank you to
        this massive cast who kept it \U0001F4AF and also kept the secret of this
        video even existing.<\\/p><\\/blockquote>\\\\n\\\\n<p>–via <a href=\\\\\\\"https://x.com/taylorswift13/status/1974974882283725029\\\\\\\"
        rel=\\\\\\\"noopener nofollow\\\\\\\">X<\\/a> (October 5, 2025)<\\/p>\\\"},\\\"type\\\":\\\"answer\\\"},\\\"960126\\\":{\\\"authors\\\":[{\\\"user\\\":8280771,\\\"pinnedRole\\\":null,\\\"attribution\\\":0.5616438356164384,\\\"type\\\":\\\"user_attribution\\\"},{\\\"user\\\":3499648,\\\"pinnedRole\\\":null,\\\"attribution\\\":0.4383561643835616,\\\"type\\\":\\\"user_attribution\\\"}],\\\"answerSource\\\":null,\\\"currentUserMetadata\\\":{\\\"interactions\\\":{\\\"vote\\\":null},\\\"excludedPermissions\\\":[\\\"vote\\\",\\\"edit\\\",\\\"destroy\\\"],\\\"permissions\\\":[]},\\\"votesTotal\\\":15,\\\"id\\\":960126,\\\"hasVoters\\\":true,\\\"editorialState\\\":\\\"normal\\\",\\\"createdAt\\\":1760115099,\\\"bodyForEdit\\\":\\\"\\\\\\\"The
        Fate of Ophelia\\\\\\\" [debuted](https://www.billboard.com/lists/taylor-swift-hot-100-fate-of-ophelia-number-one/keep-it-one-hundred-swift-nos-1-through-12/)
        at #1 on the Hot 100 chart, marking Taylor\\'s 13th #1 on the chart. In the
        UK, the song [debuted](https://www.officialcharts.com/charts/singles-chart/20251010/7501/)
        at #1 on the UK\\'s Official Singles Chart, marking Taylor\\'s fifth #1 song
        on the chart.\\\\n\\\\nDuring the tracking week ending December 5, 2025, the
