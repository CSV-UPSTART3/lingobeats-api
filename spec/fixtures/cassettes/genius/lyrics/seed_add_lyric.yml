        the idea that like, ‘You you saved me from love driving me mad,’ right? ‘Cause
        that’s what happened to Ophelia. Spoiler alert.<\\/p><\\/blockquote>\\\\n\\\\n<p>—via
        <a href=\\\\\\\"https://www.youtube.com/watch?v=Cqw8fZhggbQ\\\\\\\" rel=\\\\\\\"noopener
        nofollow\\\\\\\">BBC Radio 1<\\/a><\\/p>\\\\n\\\\n<hr>\\\\n\\\\n\\\\n<blockquote><p>‘The
        Fate of Ophelia’ is the first track off of my album The Life of a Showgirl<br>\\\\nAnd
        I really love this song because it kind of combines sort of Shakespearean
