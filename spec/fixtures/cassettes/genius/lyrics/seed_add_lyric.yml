        \\'Cause that\\'s what happened to Ophelia. Spoiler alert.\\\\n\\\\n---via
        [BBC Radio 1](https://www.youtube.com/watch?v=Cqw8fZhggbQ)\\\\n\\\\n<hr>\\\\n\\\\n>\\'The
        Fate of Ophelia\\' is the first track off of my album The Life of a Showgirl\\\\r\\\\nAnd
        I really love this song because it kind of combines sort of Shakespearean
        storytelling of you know, this legend of- of this tragic hero Ophelia and
